<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Viewer - StudyO</title>
    <script>
        document.documentElement.classList.add('auth-pending');
    </script>
    <script>
        (function(){
            const orig = console.warn;
            console.warn = function(...args){
                try{ if (args && args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return; }catch(e){}
                orig.apply(console,args);
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0a0a0c',
                            card: '#11131a',
                            sidebar: '#0a0a0c',
                            input: '#1a1d26'
                        },
                        brand: {
                            primary: '#a855f7',
                            glow: '#d946ef',
                            text: '#e2e8f0'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-on-load { opacity: 0; }
        .animate-on-load.animated { animation: fadeInUp 0.6s ease-out forwards; }
        .animate-sidebar { opacity: 0; }
        .animate-sidebar.animated { animation: fadeInLeft 0.5s ease-out forwards; }

        /* --- SIDEBAR COLLAPSE STYLES (CORREGIDO) --- */
        aside { transition: width 0.22s ease; overflow: hidden; }
        body.is-desktop-sidebar-collapsed aside { width: 80px !important; min-width: 80px !important; }
        body.is-desktop-sidebar-collapsed aside .logo-text,
        body.is-desktop-sidebar-collapsed aside nav a span,
        body.is-desktop-sidebar-collapsed aside .border-t a span,
        body.is-desktop-sidebar-collapsed aside .border-t .text-xs
        { display: none; }
        body.is-desktop-sidebar-collapsed aside nav a,
        body.is-desktop-sidebar-collapsed aside .border-t a
        { justify-content: center; padding-left: 0.75rem; padding-right: 0.75rem; }
        body.is-desktop-sidebar-collapsed aside nav a i,
        body.is-desktop-sidebar-collapsed aside nav a [data-lucide],
        body.is-desktop-sidebar-collapsed aside .border-t a i,
        body.is-desktop-sidebar-collapsed aside .border-t a [data-lucide]
        { width: 28px !important; height: 28px !important; }
        [data-sidebar-toggle] { transition: transform 0.2s ease; }
        body.is-desktop-sidebar-collapsed [data-sidebar-toggle] { transform: rotate(180deg); }
        body.is-desktop-sidebar-collapsed #sidebarToggleBtn i { width: 20px !important; height: 20px !important; }
    </style>
  <script type="module" crossorigin src="/assets/readingViewer-BsCr5V0V.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-gate-BmIZwCWq.js">
  <link rel="modulepreload" crossorigin href="/assets/responsive-s2kymlAu.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-gate-Dn5R9NA5.css">
</head>
<body class="bg-dark-bg text-gray-300 h-screen flex overflow-hidden selection:bg-purple-500 selection:text-white">

    <aside id="sidebar" class="w-64 bg-dark-sidebar flex flex-col border-r border-gray-800/50 h-full flex-shrink-0 animate-sidebar">
        <div class="p-6 flex items-center gap-3">
            <i data-lucide="book-open" class="text-white w-6 h-6"></i>
            <span class="text-xl font-bold text-white tracking-wide logo-text">StudyO</span>
            <button id="sidebarToggleBtn" data-sidebar-toggle class="ml-auto text-gray-500 w-8 h-8 flex items-center justify-center rounded hover:bg-white/5" aria-label="Toggle sidebar">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-2">
            <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span data-i18n="nav.home">Inicio</span>
            </a>
            <a href="/planner" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                <span data-i18n="nav.planner">Planificador</span>
            </a>
            <a href="/subjects" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="monitor" class="w-5 h-5"></i>
                <span data-i18n="nav.subjects">Mi Sistema Académico</span>
            </a>
            <a href="/habits" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="target" class="w-5 h-5"></i>
                <span data-i18n="nav.habits">Hábitos</span>
            </a>
            <a href="/progress" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="trending-up" class="w-5 h-5"></i>
                <span data-i18n="nav.progress">Progreso</span>
            </a>
            <a href="/reading" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-500 to-purple-600 text-white shadow-[0_0_15px_rgba(168,85,247,0.5)] font-medium">
                <i data-lucide="book" class="w-5 h-5"></i>
                <span data-i18n="nav.reading">Lecturas</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800/50 space-y-2">
            <a href="/profile" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gradient-to-r hover:from-purple-500/10 hover:via-fuchsia-500/10 hover:to-purple-500/10 text-gray-400 hover:text-purple-300 transition-all duration-300">
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span data-i18n="nav.settings">Ajustes</span>
            </a>
            <a href="#" id="logoutBtn" class="flex items-center gap-3 px-4 py-2 rounded-xl hover:bg-gradient-to-r hover:from-red-500/10 hover:via-pink-500/10 hover:to-red-500/10 text-red-400 hover:text-red-300 transition-all duration-300">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span data-i18n="nav.logout">Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto relative">
        <div class="p-8 max-w-6xl mx-auto space-y-6">
            <header class="flex flex-wrap items-center justify-between gap-4 animate-on-load delay-200">
                <div>
                    <h1 id="bookTitle" class="text-3xl font-bold text-white mb-2" data-i18n="reading.viewerTitle">Reading Viewer</h1>
                    <p id="bookMeta" class="text-gray-400" data-i18n="reading.viewerSubtitle">Cargando información del libro...</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/reading" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-gray-700 text-gray-300 hover:text-white text-sm font-medium transition-all duration-300 flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span data-i18n="reading.backToLibrary">Volver</span>
                    </a>
                    <div id="completionBadge" class="hidden px-3 py-2 rounded-full bg-green-500/15 text-green-300 text-xs font-semibold uppercase tracking-wide" data-i18n="reading.completed">Completed</div>
                </div>
            </header>

            <div class="bg-dark-card rounded-3xl p-5 space-y-5 animate-on-load delay-300" style="box-shadow: 0 0 0 1px rgba(168,85,247,0.2), 0 0 30px rgba(168,85,247,0.15), inset 0 0 20px rgba(168,85,247,0.03);">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <button id="prevPageBtn" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-gray-700 text-gray-300 hover:text-white text-sm font-medium transition-all duration-300 flex items-center gap-2">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            <span data-i18n="reading.prevPage">Anterior</span>
                        </button>
                        <button id="nextPageBtn" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-gray-700 text-gray-300 hover:text-white text-sm font-medium transition-all duration-300 flex items-center gap-2">
                            <span data-i18n="reading.nextPage">Siguiente</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="text-sm text-gray-400">
                        <span data-i18n="reading.pageLabel">Página</span> <span id="currentPage">1</span> / <span id="totalPages">1</span>
                    </div>
                </div>

                <div id="pdfContainer" class="w-full overflow-auto rounded-2xl border border-gray-800 bg-[#0b0c10]">
                    <canvas id="pdfCanvas" class="mx-auto block"></canvas>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-4 text-sm text-gray-400">
                    <div>
                        <span data-i18n="reading.lastSavedLabel">Última actualización:</span> <span id="lastSavedAt" data-i18n="reading.lastSavedPending">Pendiente</span>
                    </div>
                    <div id="progressLabel" class="text-purple-300 font-semibold">0%</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.animate-sidebar');
            if (sidebar) {
                setTimeout(() => {
                    sidebar.classList.add('animated');
                }, 50);
            }
            const animatedElements = document.querySelectorAll('.animate-on-load');
            animatedElements.forEach((element, index) => {
                setTimeout(() => {
                    element.classList.add('animated');
                }, 100 + (index * 50));
            });
        });
    </script>

</body>
</html>
