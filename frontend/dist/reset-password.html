<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | StudyO</title>
  <script type="module" crossorigin src="/assets/resetPassword-CnRWtKYH.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-gate-C5KWgIgn.js">
  <link rel="modulepreload" crossorigin href="/assets/responsive-CpSWI5uT.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-gate-Dn5R9NA5.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <h1>Nueva contraseña</h1>
        <p class="auth-subtitle">Elegí una contraseña segura para continuar 🔐</p>

        <form class="auth-form" id="resetPasswordForm">
            <input type="email" id="email" placeholder="Email" required>

            <input type="password" id="password" placeholder="Nueva contraseña" required>
            <input type="password" id="passwordConfirm" placeholder="Confirmar contraseña" required>

            <!-- Password rules -->
            <ul id="passwordRules" style="font-size: 13px; margin-bottom: 15px;">
                <li id="rule-length">❌ Mínimo 8 caracteres</li>
                <li id="rule-uppercase">❌ Al menos una mayúscula</li>
                <li id="rule-number">❌ Al menos un número</li>
                <li id="rule-match">❌ Las contraseñas coinciden</li>
            </ul>

            <div id="errorMessage" style="color: red; display: none; margin-bottom: 10px;"></div>
            <div id="successMessage" style="color: green; display: none; margin-bottom: 10px;"></div>

            <button type="submit" class="btn-primary" style="width: 100%; border-radius: 10px;">
                Restablecer contraseña
            </button>
        </form>

        <p class="auth-footer">
            ¿Necesitás volver?
            <a href="/login">Iniciar sesión</a>
        </p>
    </div>

</body>
</html>
