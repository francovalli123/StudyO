<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Studyo</title>
    <link rel="stylesheet" href="./src/css/styles.css">
    <script>
        document.documentElement.classList.add('auth-pending');
    </script>
</head>

<body class="auth-body">
    <div class="auth-container">
        <h1>Crear Cuenta</h1>
        <p class="auth-subtitle">Unite y empeza a dominar tu estudio</p>

        <form class="auth-form" id="registerForm">
            <input type="text" id="username" placeholder="Nombre de usuario" required>
            <input type="text" id="firstName" placeholder="Nombre" required>
            <input type="text" id="lastName" placeholder="Apellido" required>
            <input type="email" id="email" placeholder="Email" required>

            <input type="password" id="password" placeholder="Contrasena" required>
            <input type="password" id="passwordConfirm" placeholder="Confirmar contrasena" required>

            <ul id="passwordRules" style="font-size: 13px; margin-bottom: 15px;">
                <li id="rule-length">X Minimo 8 caracteres</li>
                <li id="rule-uppercase">X Al menos una mayuscula</li>
                <li id="rule-number">X Al menos un numero</li>
                <li id="rule-match">X Las contrasenas coinciden</li>
            </ul>

            <select id="country" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 15px;">
                <option value="">Selecciona tu pais</option>
                <option value="AR">Argentina</option>
                <option value="BO">Bolivia</option>
                <option value="BR">Brasil</option>
                <option value="CL">Chile</option>
                <option value="CO">Colombia</option>
                <option value="CR">Costa Rica</option>
                <option value="CU">Cuba</option>
                <option value="DO">Republica Dominicana</option>
                <option value="EC">Ecuador</option>
                <option value="SV">El Salvador</option>
                <option value="GT">Guatemala</option>
                <option value="HN">Honduras</option>
                <option value="MX">Mexico</option>
                <option value="NI">Nicaragua</option>
                <option value="PA">Panama</option>
                <option value="PY">Paraguay</option>
                <option value="PE">Peru</option>
                <option value="PR">Puerto Rico</option>
                <option value="UY">Uruguay</option>
                <option value="VE">Venezuela</option>
                <option value="US">Estados Unidos</option>
                <option value="CA">Canada</option>
                <option value="ES">Espana</option>
                <option value="FR">Francia</option>
                <option value="IT">Italia</option>
                <option value="DE">Alemania</option>
                <option value="GB">Reino Unido</option>
                <option value="PT">Portugal</option>
                <option value="OTHER">Otro</option>
            </select>

            <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                <label for="captchaAnswer" id="captchaQuestion" style="font-size:14px; color:#333;">Cargando captcha...</label>
                <button type="button" id="reloadCaptchaBtn" class="btn-secondary" style="padding:8px 10px;">Recargar</button>
            </div>
            <input type="text" id="captchaAnswer" placeholder="Respuesta captcha" required>

            <div id="errorMessage" style="color: red; display: none; margin-bottom: 10px;"></div>
            <div id="successMessage" style="color: green; display: none; margin-bottom: 10px;"></div>

            <button type="submit" class="btn-primary" style="width: 100%; border-radius: 10px;">
                Crear cuenta
            </button>
        </form>

        <p class="auth-footer">
            Ya tenes cuenta?
            <a href="/login">Iniciar Sesion</a>
        </p>
    </div>

    <script type="module">
        import { initAuthGate } from './src/ts/auth-gate.ts';
        initAuthGate();
    </script>

    <script type="module">
        import { getSignupCaptcha, register } from './src/ts/api.ts';

        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('passwordConfirm');
        const captchaQuestion = document.getElementById('captchaQuestion');
        const captchaAnswerInput = document.getElementById('captchaAnswer');
        const reloadCaptchaBtn = document.getElementById('reloadCaptchaBtn');

        const ruleLength = document.getElementById('rule-length');
        const ruleUppercase = document.getElementById('rule-uppercase');
        const ruleNumber = document.getElementById('rule-number');
        const ruleMatch = document.getElementById('rule-match');

        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        let captchaId = '';

        async function loadCaptcha() {
            try {
                const captcha = await getSignupCaptcha();
                captchaId = captcha.captcha_id;
                captchaQuestion.textContent = captcha.captcha_question;
                captchaAnswerInput.value = '';
            } catch (err) {
                captchaId = '';
                captchaQuestion.textContent = 'No se pudo cargar captcha. Reintenta.';
            }
        }

        function validatePassword() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const matches = password && confirm && password === confirm;

            updateRule(ruleLength, hasLength);
            updateRule(ruleUppercase, hasUppercase);
            updateRule(ruleNumber, hasNumber);
            updateRule(ruleMatch, matches);

            return hasLength && hasUppercase && hasNumber && matches;
        }

        function updateRule(element, valid) {
            element.textContent = element.textContent.replace(/^OK|X/, valid ? 'OK' : 'X');
            element.style.color = valid ? 'green' : 'red';
        }

        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);
        reloadCaptchaBtn.addEventListener('click', loadCaptcha);
        loadCaptcha();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            if (!validatePassword()) {
                errorMessage.textContent = 'La contrasena no cumple los requisitos.';
                errorMessage.style.display = 'block';
                return;
            }

            const username = document.getElementById('username').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            const country = document.getElementById('country').value;
            const captchaAnswer = captchaAnswerInput.value.trim();

            if (!captchaId || !captchaAnswer) {
                errorMessage.textContent = 'Debes completar el captcha.';
                errorMessage.style.display = 'block';
                await loadCaptcha();
                return;
            }

            try {
                await register(username, email, password, firstName, lastName, country, captchaId, captchaAnswer);

                successMessage.textContent = 'Cuenta creada exitosamente. Redirigiendo...';
                successMessage.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } catch (error) {
                errorMessage.textContent = error.message || 'Error al crear la cuenta.';
                errorMessage.style.display = 'block';
                await loadCaptcha();
            }
        });
    </script>
    <script type="module" src="./src/ts/responsive.ts?v=20260212"></script>
</body>
</html>
